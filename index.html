        <h1>LIGHT IN THE SOCIETY INTERNATIONAL</h1>
        <p><em>Lighting up society, transforming the world.</em></p>

        <h2>About Light in the Society International</h2>
        <p>
          Light in the Society International (LITS) is a registered NGO in Kenya dedicated to
          empowering youth, women, and vulnerable communities. Through education, peace promotion,
          talent development, and environmental conservation, we work to build a united and
          prosperous society guided by love, peace, and unity.
        </p>

        <h2>Our Core Values</h2>
        <p>Empowering communities through sustainable development and social unity.</p>

        <h3>Poverty Alleviation</h3>
        <p>
          Training programs enhancing skills and leadership among youth. We create pathways out of
          poverty by equipping vulnerable communities with skills, opportunities, and resources
          that promote self-reliance and long-term growth.
        </p>

        <h3>Youth &amp; Women Empowerment</h3>
        <p>
          Through mentorship, training, and exposure, we empower youth and women to unlock their
          potential, nurture their talents, and become leaders of change in society.
        </p>

        <h3>Environmental Conservation</h3>
        <p>
          Our programs inspire young people to take action in protecting natural resources,
          planting trees, and creating sustainable solutions.
        </p>

        <h3>Peace Promotion</h3>
        <p>
          We champion peace, love, and unity by engaging communities in dialogue, peace walks, and
          awareness forums that foster harmony and mutual respect.
        </p>

        <h2>Contact Us</h2>
